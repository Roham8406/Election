name: election-system

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: election-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: electiondb
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Node.js Backend API
  backend:
    build: 
      context: ./backend
    container_name: election-backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://admin:secretpassword@db:5432/electiondb
      - ALLOWED_ORIGINS=http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      - db

  # 3. Vue.js Frontend
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:3000 
    container_name: election-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata: