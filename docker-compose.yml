name: election-system

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: election-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: electiondb
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Node.js Backend API
  backend:
    build: 
      context: ./backend
    container_name: election-backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://admin:secretpassword@db:5432/electiondb
      - ALLOWED_ORIGINS=http://localhost:8081,http://server-b65d7767-9615-450a-b2cd-6ad323fd5d47.ir-thr-fr1.arvancompute.ir:8081

      # TODO Delete localhost
      - TELEGRAM_BOT_TOKEN=YOUR_TELEGRAM_BOT_TOKEN_HERE
      - TELEGRAM_PROXY_URL=https://aged-shape-a9f5.roham8406.workers.dev

    ports:
      - "3000:3000"
    depends_on:
      - db

  # 3. Vue.js Frontend
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:3000 
    container_name: election-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
  
  # 4. Telegram Bot
  bot:
    build: 
      context: ./bot
    container_name: election-bot
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://admin:secretpassword@db:5432/electiondb
      - TELEGRAM_BOT_TOKEN=YOUR_TELEGRAM_BOT_TOKEN_HERE
      - TELEGRAM_PROXY_URL=https://aged-shape-a9f5.roham8406.workers.dev
      - HR_ID=1619813422
      - MANAGER_ID=1619813422
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - db
volumes:
  pgdata: